name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Validate OPENCODE_API_KEY
        id: validate
        run: |
          if [ -z "$OPENCODE_API_KEY" ]; then
            echo "OPENCODE_API_KEY is not set or is empty. Skipping opencode step."
            echo "skip_opencode=true" >> $GITHUB_OUTPUT
          else
            echo "skip_opencode=false" >> $GITHUB_OUTPUT
          fi

      - name: Run opencode
        if: steps.validate.outputs.skip_opencode != 'true'
        uses: anomalyco/opencode/github@v1.18.10
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/big-pickle
